      { q: "保存聚落不僅是維修硬體建築，還包含維護當地的什麼無形文化？", options: ["高科技產品", "交通建設", "外來飲食"], answer: "歌謠與諺語" },
      { q: "位於苗栗縣頭份市的「蘆竹湳聚落」，主要是由誰來積極維護這些三合院？", options: ["外國遊客", "中央政府", "私人企業"], answer: "當地居民" },
      { q: "澎湖縣的「二崁村」是哪一個時期成形的閩南式漢人街庄？", options: ["荷西時期", "日治時期", "戰後時期"], answer: "清帝國時期" },
      { q: "金門的「山後民俗文化村」是由幾棟整齊劃一的大厝所組成的閩南建築群？", options: ["8棟", "10棟", "36棟"], answer: "18棟" }
    ];

    // --- 測驗狀態管理 ---
    let currentQuizList = [];
    let currentQIndex = 0;
    let currentScore = 0;

    // 洗牌工具函數
    function shuffleArray(array) {
      const newArray = [...array];
      for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
      }
      return newArray;
    }

    // --- 網頁邏輯與狀態管理 ---
    let activeTabId = lessonData[0].id;

    function renderTabs() {
      const tabsContainer = document.getElementById('tabs-container');
      tabsContainer.innerHTML = lessonData.map(lesson => {
        // 只取頓號後面的標題文字
        const shortTitle = lesson.title.split('、')[1] || lesson.title;
        const isActive = activeTabId === lesson.id;
        const btnClasses = isActive
          ? `${lesson.btnColor} text-white shadow-lg transform scale-105`
          : 'bg-white text-gray-600 hover:bg-amber-100';

        return `
          <button
            onclick="changeTab(${lesson.id})"
            class="px-4 py-3 rounded-full font-bold text-sm md:text-base transition-all duration-300 shadow-sm flex items-center gap-2 ${btnClasses}"
          >
            <span class="text-xl">${lesson.icon}</span>
            ${shortTitle}
          </button>
        `;
      }).join('');
    }

    function changeTab(id) {
      activeTabId = id;
      renderTabs();
      renderContent();
      // 切換標籤時畫面回到頂部
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderContent() {
      const currentData = lessonData.find(d => d.id === activeTabId);
      const wrapper = document.getElementById('content-wrapper');

      // 更新外框顏色
      wrapper.className = `rounded-2xl shadow-xl p-6 md:p-8 transition-colors duration-500 ${currentData.color} bg-opacity-30 bg-white relative`;

      // 判斷是否為測驗頁面
      if (currentData.isQuiz) {
        // ✨ 加入下面這行，強制將測驗區塊的背景設為純白 (bg-white)
        wrapper.className = 'rounded-2xl shadow-xl p-6 md:p-8 transition-colors duration-500 bg-white relative';

        wrapper.innerHTML = `
          <div class="text-center py-12 animate-fade-in">
             <div class="text-7xl mb-6">📝</div>
             <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">傳統住屋大挑戰</h2>
             <button onclick="startQuiz()" class="${currentData.btnColor} text-white px-10 py-4 rounded-full text-2xl font-bold shadow-lg hover:scale-110 transition-transform">
               ▶️ 開始測驗
             </button>
          </div>
        `;
        return; // 提早結束，不執行下方一般文章內容的渲染
      }

      let contentHTML = `
        <h2 class="text-2xl md:text-3xl font-bold mb-6 flex items-center gap-3 border-b-2 border-current pb-3">
          <span class="text-3xl">${currentData.icon}</span>
          ${currentData.title}
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      `;

      currentData.items.forEach((item, index) => {
        const imgBoxId = `card-img-${index}`;

        let termsHTML = '';
        if (item.terms && item.terms.length > 0) {
          const buttonsHTML = item.terms.map((term, termIndex) => `
            <button
              onclick="showTermDetail(${currentData.id}, ${index}, ${termIndex})"
              class="${currentData.btnColor} text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-sm hover:scale-105 transition-transform"
            >
              ${term.name}
            </button>
          `).join('');

          termsHTML = `
            <div class="mt-auto pt-4">
              <p class="text-sm font-semibold text-gray-500 mb-2">💡 點擊名詞看解釋：</p>
              <div class="flex flex-wrap gap-2">
                ${buttonsHTML}
              </div>
            </div>
          `;
        }

        contentHTML += `
          <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300 flex flex-col h-full">
            <div id="${imgBoxId}" class="bg-gray-200 aspect-[3/2] w-full flex items-center justify-center text-gray-500 italic overflow-hidden text-center border-b border-gray-100 shrink-0 transition-all duration-300">
              ${item.image || '🖼️ 預設圖片放置區'}
            </div>
            
            <div class="p-5 flex-1 flex flex-col">
              <h3 class="text-xl font-bold text-gray-800 mb-2">${item.name}</h3>
              <p class="text-gray-600 mb-4">${item.desc}</p>
              
            <div id="local-info-${index}" class="hidden mb-4 p-4 rounded-lg bg-gray-50 border-l-4 transition-all duration-300 animate-fade-in">
                <h4 id="local-title-${index}" class="font-bold text-lg mb-1"></h4>
                <p id="local-detail-${index}" class="text-gray-700 mb-2"></p>
                <div id="local-keywords-${index}" class="flex flex-wrap gap-1 mt-2"></div>
              </div>

              ${termsHTML}
            </div>
          </div>
        `;
      });

      contentHTML += `</div>`;
      wrapper.innerHTML = contentHTML;
    }

    function showTermDetail(lessonId, itemIndex, termIndex) {
      const currentData = lessonData.find(d => d.id === lessonId);
      const item = currentData.items[itemIndex];
      const term = item.terms[termIndex];

      const title = term.name;
      const detail = term.detail;
      const textColorClass = currentData.color.split(' ').find(c => c.startsWith('text-'));
      const borderColorClass = currentData.btnColor.split(' ').find(c => c.startsWith('bg-')).replace('bg-', 'border-');

      const targetImgId = `card-img-${itemIndex}`;
      const newImageHTML = term.image || item.image || '🖼️ 相關圖片';

      // 抓取被點擊的那張卡片內部的專屬對話框與元件
      const localInfoBox = document.getElementById(`local-info-${itemIndex}`);
      const localInfoTitle = document.getElementById(`local-title-${itemIndex}`);
      const localInfoDetail = document.getElementById(`local-detail-${itemIndex}`);
      const localKeywords = document.getElementById(`local-keywords-${itemIndex}`);

      if (localInfoBox) {
        localInfoTitle.textContent = title;
        localInfoTitle.className = `font-bold text-lg mb-1 ${textColorClass}`;
        localInfoDetail.textContent = detail;

        // 顯示手動設定的關鍵字
        if (term.keywords && term.keywords.length > 0) {
          localKeywords.innerHTML = term.keywords.map(kw =>
            `<span class="inline-block bg-gray-200 text-gray-600 rounded-full px-2.5 py-1 text-xs font-medium tracking-wide">#${kw}</span>`
          ).join('');
        } else {
          localKeywords.innerHTML = '';
        }

        localInfoBox.className = `mb-4 p-4 rounded-lg bg-gray-50 border-l-4 ${borderColorClass} transition-all duration-300 animate-fade-in block`;
      }

      // 圖片替換邏輯
      const imgContainer = document.getElementById(targetImgId);
      if (imgContainer) {
        const getSrc = (htmlString) => {
          const match = htmlString.match(/src=['"]([^'"]+)['"]/);
          return match ? match[1] : htmlString.trim();
        };

        const currentSrc = getSrc(imgContainer.innerHTML);
        const newSrc = getSrc(newImageHTML);

        if (currentSrc !== newSrc) {
          imgContainer.style.opacity = '0';
          setTimeout(() => {
            imgContainer.innerHTML = newImageHTML;
            imgContainer.style.opacity = '1';
          }, 150);
        }
      }
    }

    // 初始化渲染
    renderTabs();
    renderContent();

    // 開始測驗
    function startQuiz() {
      currentQuizList = shuffleArray(questionBank).slice(0, 10);
      currentQIndex = 0;
      currentScore = 0;
      renderQuizQuestion();
    }

    // 渲染單一題目
    function renderQuizQuestion() {
      const wrapper = document.getElementById('content-wrapper');

      // 測驗結束，顯示成績
      if (currentQIndex >= currentQuizList.length) {
        wrapper.innerHTML = `
          <div class="text-center py-12 animate-fade-in">
            <h2 class="text-4xl font-bold mb-4 text-teal-700">🎉 測驗完成！</h2>
            <p class="text-2xl mb-8 font-semibold text-gray-700">你的成績是： <span class="text-5xl text-red-500">${currentScore * 10}</span> 分</p>
            <p class="text-lg text-gray-600 mb-8">（答對了 ${currentScore} / 10 題）</p>
            <button onclick="changeTab(5)" class="bg-teal-500 hover:bg-teal-600 text-white px-8 py-3 rounded-full text-xl font-bold shadow-md hover:scale-105 transition-transform">
              再挑戰一次 🔄
            </button>
          </div>
        `;
        return;
      }

      // 取得當前題目並混淆選項
      const q = currentQuizList[currentQIndex];
      let optionsData = q.options.map(opt => ({ text: opt, isCorrect: false }));
      optionsData.push({ text: q.answer, isCorrect: true });
      optionsData = shuffleArray(optionsData);

      let optionsHTML = optionsData.map((opt, idx) => `
        <button 
          onclick="checkAnswer(this, ${opt.isCorrect})" 
          class="quiz-option w-full h-full min-h-[80px] text-left p-4 rounded-xl border-2 border-teal-200 hover:bg-teal-50 hover:border-teal-400 text-lg md:text-xl font-medium text-gray-700 transition-all shadow-sm flex items-center"
        >
          ${idx + 1}. ${opt.text}
        </button>
      `).join('');

      wrapper.innerHTML = `
        <div class="max-w-3xl mx-auto animate-fade-in relative pb-16">
          <div class="flex justify-between items-center mb-6 border-b-2 border-teal-100 pb-3">
             <span class="text-teal-600 font-bold text-lg">第 ${currentQIndex + 1} / 10 題</span>
             <span class="text-orange-500 font-bold text-lg">目前得分：${currentScore * 10}</span>
          </div>
          <h3 class="text-2xl md:text-3xl font-bold text-gray-800 mb-8 leading-relaxed">
            Q: ${q.q}
          </h3>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="options-container">
            ${optionsHTML}
          </div>
          
          <div id="next-btn-container" class="hidden absolute -bottom-4 right-0 mt-8">
             <button onclick="nextQuestion()" class="bg-teal-600 text-white px-8 py-3 rounded-xl text-xl font-bold shadow-lg hover:bg-teal-700 transition-all flex items-center gap-2">
               下一題 ➡️
             </button>
          </div>
        </div>
      `;
    }

    // 檢查答案
    function checkAnswer(btnElement, isCorrect) {
      const allButtons = document.querySelectorAll('.quiz-option');
      allButtons.forEach(btn => btn.onclick = null);

      if (isCorrect) {
        btnElement.classList.add('bg-green-100', 'border-green-500', 'text-green-800', 'scale-[1.02]');
        btnElement.innerHTML += ' ✅';
        currentScore++;
      } else {
        btnElement.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
        btnElement.innerHTML += ' ❌';

        const correctText = currentQuizList[currentQIndex].answer;
        allButtons.forEach(btn => {
          if (btn.innerText.includes(correctText)) {
            btn.classList.add('bg-green-50', 'border-green-400', 'text-green-700');
            btn.innerHTML += ' 💡 (正確答案)';
          }
        });
      }

      document.getElementById('next-btn-container').classList.remove('hidden');
    }

    // 進入下一題
    function nextQuestion() {
      currentQIndex++;
      renderQuizQuestion();
    }
  </script>
</body>

</html>
